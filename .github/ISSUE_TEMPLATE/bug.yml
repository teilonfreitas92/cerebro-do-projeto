name: Problema
description: Algo não funciona como deveria no Cérebro do Projeto.
title: "[Problema] "
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! **Antes de escrever, atenção à privacidade:**
        - **NÃO cole conversas do Claude Code, memória, transcrições nem saídas inteiras de comandos.** Elas podem ter código, nomes e segredos.
        - **NÃO cole chaves, tokens, senhas** nem o link de abertura do painel (ele leva a sua chave de acesso: `?t=...`).
        - Troque o seu nome e os nomes dos seus projetos em caminhos por exemplos (`C:\Users\ana\Projetos\loja`).
        - Se der, reproduza o problema na **demonstração** (`python demo/rodar_demo.py`), que usa dados inventados.

        Falha de **segurança**? Não abra issue: use o relato privado explicado no SECURITY.md.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: Conte com as suas palavras. Pode ser simples.
      placeholder: "Cliquei em Fazer backup agora e apareceu a mensagem ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para acontecer de novo
      placeholder: |
        1. Abri a aba ...
        2. Cliquei em ...
        3. Apareceu ...
  - type: input
    id: versao
    attributes:
      label: Versão do Cérebro
      description: Está em Configurações › Aparência e servidor.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Outro
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Versão do Python (python --version)
      placeholder: "3.12.x"
  - type: dropdown
    id: onde
    attributes:
      label: Onde aconteceu
      options:
        - Na demonstração (dados inventados)
        - Com os meus projetos
        - No instalador ou no desinstalador
        - Na linha de comando (cerebro_cli.py)
    validations:
      required: true
  - type: textarea
    id: mensagem
    attributes:
      label: Mensagem de erro (só o trecho que importa)
      description: Confira antes que não tem nome, caminho pessoal nem segredo. Foto da tela? Recorte só a parte do erro.
      render: text
  - type: checkboxes
    id: privacidade
    attributes:
      label: Conferência
      options:
        - label: Conferi que não colei conversas, memória, segredos nem dados pessoais.
          required: true
