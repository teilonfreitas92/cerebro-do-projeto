# Verificação automática do Cérebro do Projeto.
# Roda sozinha a cada push e pull request (só quando o repositório estiver no GitHub): erros de Python (ruff), a suíte inteira de
# testes e a prova do instalador numa máquina limpa. Não usa nenhum segredo e só lê o repositório.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read                       # o mínimo: só ler o código

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"                      # textos em português no terminal do Windows
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar as dependências
        run: python -m pip install -r requirements.txt ruff==0.17.1
      - name: Verificar o código (ruff)
        run: ruff check .
      - name: Rodar a suíte de testes
        run: python -m unittest discover -s testes -t . -p "test_*.py"

  instalador-pc-limpo:
    name: Instalador num PC limpo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}                # as máquinas do GitHub nascem limpas: sem Cérebro, sem ~/.cerebro, sem .claude
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar, subir, abrir a página, encerrar e desinstalar
        run: python testes/ci_instalador.py
